version: 1
tests:
  benford:
    status: implemented
    version: "1.1.0"
    module: forensic_platform.tests_engine.benford
    required_fields:
      - name: column
        type: numeric
        description: A single numeric column (amounts, quantities, etc.) with a naturally unconstrained range.
    algorithm: >
      First-digit Benford's Law test (Nigrini, 2012): computes the leading-digit
      distribution of the given column via SQL aggregation, compares it to the
      theoretical Benford distribution using MAD (Mean Absolute Deviation) and
      chi-square, and classifies conformity using Nigrini's published MAD bands.
    limitations: >
      First-digit test only (no second-order, summation, or distortion-factor
      tests yet). Not valid for columns with an artificially constrained range
      (sequential IDs, fixed-price items, assigned account codes). Small sample
      sizes (under ~300 usable values) produce unreliable MAD/chi-square results
      per Nigrini's guidance are declined (INSUFFICIENT_DATA), as are columns that look
      constrained or assigned (NOT_APPLICABLE); the thresholds are unvalidated starting
      defaults. The column must be confirmed as an amount by a named person
      (--confirmed-by) before the test runs. Values below 1 are counted by their first
      significant digit (1.0.0 dropped them).

  duplicate-analysis:
    status: implemented
    version: "1.0.0"
    module: forensic_platform.tests_engine.duplicate_analysis
    required_fields:
      - name: column
        type: any
        description: The identifier column to test (e.g. a certificate or registration number).
      - name: distinct_of
        type: any
        optional: true
        description: >
          Optional second column. When supplied the test switches from plain duplicate
          detection to shared-identifier detection - key values mapping to more than
          one distinct value of this column.
    parameters:
      min_occurrences: 2
      exclude_placeholders: true
      evidence_limit: 50000
    algorithm: >
      Groups rows by the normalised key column (trim, collapse internal whitespace,
      uppercase - matching only, source never altered). In duplicate mode, flags keys
      appearing on at least min_occurrences rows. In shared-identifier mode, flags keys
      associated with at least min_occurrences distinct values of the second column.
      Placeholder tokens are optionally excluded from the key space.
    limitations: >
      Exact matching after normalisation only - no fuzzy or phonetic matching, so
      spelling variants of the same name count as distinct values and will inflate
      shared-identifier counts. Detects internal inconsistency only; it cannot confirm
      whether any identifier is genuine against an external register. Evidence links are
      capped at evidence_limit rows per run, and truncation is recorded in limitations.
      A flagged group is a structural fact about the data, never evidence of wrongdoing.
  gap-sequence: {status: not_implemented}
  round-number: {status: not_implemented}
  outlier: {status: not_implemented}
  split-transaction: {status: not_implemented}
  threshold-proximity: {status: not_implemented}
  vendor-analysis: {status: not_implemented}
  employee-vendor-match: {status: not_implemented}
  duplicate-payment:
    status: implemented
    version: "1.0.0"
    module: forensic_platform.tests_engine.duplicate_payment
    required_fields:
      - name: column
        type: any
        description: Entity/name column on the payment table (the `table` the caller supplies must already union every source system to be checked - one, two, or more).
      - name: period_column
        type: any
        description: Billing/payment period column (text or date). Grouping is always (entity, period) - never entity alone.
      - name: invoice_column
        type: any
        description: Invoice/voucher number column. This is the dimension being counted as a "paid instance"; rows sharing one invoice number are one instance, not several.
      - name: amount_column
        type: numeric
        description: Paid-amount column. Only rows with amount > 0 count as a paid instance.
      - name: identity_table
        type: any
        optional: true
        description: >
          Optional dataset carrying a real per-entity identifier independent of the payment
          rows (an account number or similar - never derived from the payment data itself).
          When supplied, becomes the ceiling: a name/period is flagged only when its paid-instance
          count EXCEEDS the number of distinct identifiers that table shows for that name/period.
      - name: name_merge_map
        type: any
        optional: true
        description: >
          Optional, explicitly human-reviewed {collapsed_name: collapsed_name} map for genuine
          spelling/transliteration variants of one entity. Never auto-generated - see limitations.
    parameters:
      min_paid_instances: 2
      evidence_limit: 50000
    algorithm: >
      Groups payment rows by (period, canonical entity key), counts distinct invoice numbers per
      group as the paid-instance count, and flags a group when that count exceeds the number of
      real distinct identities known for that name/period (from an optional identity_table), or
      exceeds min_paid_instances when no identity table is supplied. The canonical key collapses
      only honorific prefixes and whitespace automatically (always safe); genuine spelling
      variants are collapsed only via an explicit, human-reviewed name_merge_map entry - never by
      automatic fuzzy matching, because a false merge here directly produces a false duplicate
      accusation. Grouping never crosses periods and never collapses distinct invoice numbers,
      so this correctly detects both (a) the same entity appearing in two differently-labelled
      source systems for one period, and (b) the same entity appearing twice on different invoice
      numbers within a single source system - the same underlying anomaly either way.
    limitations: >
      Without an identity_table this is a naive "appears on N+ invoices this period" flag and
      cannot rule out two different real entities who happen to share a name - verified as a real
      false-positive risk during development (two distinct identities, one paid instance each,
      naive logic would flag the pair; the identity-table ceiling check exists specifically to
      prevent this). name_merge_map entries are taken on trust; an incorrect entry can both cause
      a false merge (two different people called the same) and, if omitted where it was needed,
      leave a real duplicate split into two separate unflagged groups. The caller is responsible
      for presenting the table as a single table or view already unioning every source system to
      be checked - this test has no way to discover additional sources on its own. A flagged
      group is a structural fact about paid-instance counts, never in itself evidence of
      wrongdoing.
  cross-dataset-match:
    status: implemented
    version: "1.0.0"
    module: forensic_platform.tests_engine.cross_dataset_match
    required_fields:
      - name: column
        type: any
        description: Key column in the left dataset.
      - name: right_table
        type: any
        description: The dataset to reconcile against.
      - name: right_column
        type: any
        description: Key column in the right dataset.
    parameters:
      exclude_placeholders: true
      evidence_limit: 50000
    algorithm: >
      Compares the distinct normalised key values of the left dataset against those of
      the right, reporting keys present in both, only on the left, and only on the right,
      plus coverage percentages in each direction. Evidence links are written for left
      rows whose key has no counterpart on the right.
    limitations: >
      Exact matching after normalisation - a key differing by formatting or spelling will
      read as orphaned; pair with fuzzy-entity-match where keys are name-like. Coverage is
      a statement about these two extracts only: it cannot establish that either extract
      is complete with respect to the real-world population, which requires an external
      control total. An orphaned key is a completeness or integrity fact, never in itself
      evidence of wrongdoing.
  fuzzy-entity-match:
    status: implemented
    version: "1.0.0"
    module: forensic_platform.tests_engine.fuzzy_entity_match
    required_fields:
      - name: column
        type: any
        description: Identifier column whose associated names are to be resolved (e.g. reg_no).
      - name: distinct_of
        type: any
        description: The name/entity column whose spelling variants should be collapsed.
    parameters:
      min_entities: 2
      threshold: 0.55
      exclude_placeholders: true
      evidence_limit: 50000
    algorithm: >
      For each identifier, collapses associated name strings into entity clusters and
      flags identifiers still resolving to min_entities or more distinct entities after
      collapsing. Canonicalisation drops honorifics and non-letters and produces two
      comparison forms - token-sorted (word order irrelevant) and letters-only
      (spacing irrelevant); similarity is the higher of the padded 3-gram Jaccard
      overlap of the two forms. Clustering is single-linkage union-find over inputs
      sorted first, so output is order-independent and byte-reproducible.
    methodology_citation: >
      Standard trigram (q-gram) Jaccard similarity with single-linkage agglomerative
      clustering. Implemented in-repo rather than via a database extension or external
      library so the matching logic is inspectable and reproducible by a reviewer.
    limitations: >
      Threshold-dependent: a different threshold yields different cluster counts, so the
      threshold is recorded with every run. Initials-only forms ('DR A K BHARGAVA') do not
      cluster with the expanded name and remain separate entities - verified on a real
      13-variant group. Genuinely distinct people with near-identical names WILL be merged, so the
      result is a lower bound on distinct entities, exactly as exact matching is an upper
      bound. No transliteration or phonetic matching. Detects internal inconsistency only;
      it cannot confirm identity against an external register.
  journal-entry: {status: not_implemented}
  date-time-anomaly: {status: not_implemented}
  velocity-analysis: {status: not_implemented}

  custom-test:
    status: extensible
    description: >
      Investigator-defined test. Must be added here with an explicit algorithm,
      required_fields, parameters, and limitations before it can be run — the
      engine refuses to execute anything not registered.
